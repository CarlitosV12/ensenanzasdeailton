<!DOCTYPE html>
<html>
<head>
	<title>Factooous</title>
	<style>
		img {
			display: none;
		}
	</style>
</head>
<body>
	<h1>RealgodMadrid</h1>
	
	<button onclick="mostrarImagen1()">MOSTRAR AL MEJOR EQUIPO DE EUROPA</button>
	<button onclick="mostrarImagen2()">MOSTRAR UN FACTOOOU </button>
	
	<br><br>
	
	<img id="imagen1" src="REALMADRIDGOD.png">
	<img id="imagen2" src="Papiada.jpg">
	
	<script>
		function mostrarImagen1() {
			document.getElementById("imagen1").style.display = "block";
			document.getElementById("imagen2").style.display = "none";
		}
		
		function mostrarImagen2() {
			document.getElementById("imagen2").style.display = "block";
			document.getElementById("imagen1").style.display = "none";
		}
	</script>
</body>
</html>
