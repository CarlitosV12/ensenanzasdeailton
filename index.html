<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enseñanzas de Ailton</title>
    <!-- Importando fuentes elegantes de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('Fondo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .contenedor {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            color: #ffffff;
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* Cuadro color café con letra cursiva para las categorías */
        .titulo-categoria {
            background-color: #5C4033;
            color: #f5e6d3;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 1px;
            padding: 8px 25px;
            border-radius: 8px;
            margin: 25px auto 15px auto;
            max-width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        button:hover, button.activo {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
        }

        /* Área donde aparecerá la foto y el texto (ahora se inserta debajo de cada categoría) */
        #pantalla-enseñanza {
            display: none;
            margin: 15px 0 30px 0;
            padding: 25px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            animation: fadeIn 0.8s ease;
        }

        #pantalla-enseñanza img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #texto-enseñanza {
            color: #e0e0e0;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Rincones de Sabiduría</h1>
        
        <!-- Categoría: Ailton -->
        <div class="titulo-categoria">Ailton</div>
        <div class="botones">
            <button onclick="mostrarEnseñanza(1)" id="btn-1">Enseñanza 1</button>
            <button onclick="mostrarEnseñanza(2)" id="btn-2">Enseñanza 2</button>
            <button onclick="mostrarEnseñanza(3)" id="btn-3">Enseñanza 3</button>
            <button onclick="mostrarEnseñanza(4)" id="btn-4">Enseñanza 4</button>
        </div>

        <!-- Categoría: Villacabra -->
        <div class="titulo-categoria">Villacabra</div>
        <div class="botones">
            <button onclick="mostrarEnseñanza(5)" id="btn-5">Enseñanza 1</button>
        </div>

        <!-- Categoría: Rayadito -->
        <div class="titulo-categoria">Rayadito</div>
        <div class="botones">
            <button onclick="mostrarEnseñanza(6)" id="btn-6">Enseñanza 1</button>
        </div>

        <!-- Pantalla de visualización (se moverá dinámicamente) -->
        <div id="pantalla-enseñanza">
            <img id="imagen-enseñanza" src="" alt="Imagen de la enseñanza">
            <p id="texto-enseñanza"></p>
        </div>
    </div>

    <script>
        const datosEnseñanzas = {
            1: {
                imagen: "DEPICHONAREY.png",
                texto: "Todo gran vuelo comienza en el suelo. Hubo un tiempo en que fuiste aprendiz de la vida, frágil ante el viento, buscando tu lugar en el mundo. Pero la grandeza no es un salto repentino, sino una metamorfosis silenciosa. Convertirte en el rey de tu propia historia significa mirar al espejo y reconocer tu camino con gratitud: honrando al niño que soñaba, para abrazar con absoluta convicción al hombre que hoy forja su destino. El verdadero poder nace al descubrir que cada tropiezo pulió tu corona, y que la mejor versión de ti mismo es aquella que nunca deja de elevarse.<br><br>— Ailton"
            },
            2: {
                imagen: "Ailtung.jpg",
                texto: "Así como Ailtungtung tiene la paciencia como virtud, es importante valorarla, pues en un mundo que exige inmediatez, saber esperar es un acto de fortaleza. La paciencia no es la simple inacción frente al paso del tiempo, sino la serenidad de mantener el propósito mientras las semillas que hemos plantado echan raíces en la oscuridad. Los grandes frutos de la vida, aquellos que verdaderamente trascienden, no maduran con la prisa. Aprender a aguardar el momento exacto nos enseña que cada pausa tiene un sentido, y que la recompensa más grande siempre llega a quienes saben ser guardianes serenos de su propio destino.<br><br>— Ailton"
            },
            3: {
                imagen: "Ailtang.png",
                texto: "Ailtang sonríe a la vida, porque comprende que la alegría es la brújula que guía en los días nublados. No se trata de ignorar las tormentas, sino de enfrentarlas con un espíritu luminoso. Una simple sonrisa tiene el poder de transformar tu propio camino y aliviar la carga de quienes te rodean; es, al final, el acto de gratitud más hermoso frente a cada nuevo amanecer.<br><br>— Ailton"
            },
            4: {
                imagen: "ELMERCENARIO.jpeg",
                texto: "Las batallas más duras de la vida no se pelean por el simple placer del combate, sino por la paz y la recompensa que aguardan al final del humo. Así como el mercenario tiene a sus dos palomas como símbolo de esperanza en medio del caos, tú debes aferrarte a aquello que da sentido a tu lucha. No temas a las trincheras del día a día; cada esfuerzo es un testimonio de tu valentía, y cada victoria, el dulce premio de no haberte rendido jamás.<br><br>— Ailton"
            },
            5: {
                imagen: "Villacabra.png",
                texto: "Las apariencias suelen ser el disfraz más engañoso de la realidad; lo que brilla por fuera no siempre cumple su propósito por dentro. Recuerda aquella vez que Villacabra poseía el mejor micrófono del mundo, una pieza digna de admiración, y sin embargo nadie lograba entenderle una sola palabra. De nada sirve el envoltorio más imponente si la esencia no transmite claridad. Aprende a mirar más allá de la superficie, pues el verdadero valor de las cosas nunca reside en cómo lucen, sino en el sentido con el que realmente resuenan.<br><br>— Villacabra"
            },
            6: {
                imagen: "Rayadito.jpeg",
                texto: "A veces vamos tan enfocados en las grandes hazañas que olvidamos mirar los pequeños regalos que el destino pone frente a nosotros. Recuerda cómo el Rayadito dejó escapar unos giros gratis simplemente por no prestar atención a lo que tenía al alcance. La vida está llena de detalles diminutos que esconden grandes fortunas; aprende a valorar y aprovechar cada pequeña oportunidad, pues nunca sabes qué giro inesperado puede cambiar tu suerte para siempre.<br><br>— Rayadito"
            }
        };

        let enseñanzaActual = null;

        function mostrarEnseñanza(numero) {
            const pantalla = document.getElementById('pantalla-enseñanza');
            const boton = document.getElementById(`btn-${numero}`);

            // Si se presiona la enseñanza que ya está abierta, se cierra
            if (enseñanzaActual === numero) {
                pantalla.style.display = 'none';
                boton.classList.remove('activo');
                enseñanzaActual = null;
                return;
            }

            // Mover la pantalla justo debajo de los botones de la categoría seleccionada
            const grupoBotones = boton.parentElement;
            grupoBotones.insertAdjacentElement('afterend', pantalla);

            // Reiniciar la animación
            pantalla.style.animation = 'none';
            pantalla.offsetHeight;
            pantalla.style.animation = 'fadeIn 0.8s ease';

            // Mostrar la sección
            pantalla.style.display = 'block';

            // Cambiar imagen y texto
            document.getElementById('imagen-enseñanza').src = datosEnseñanzas[numero].imagen;
            document.getElementById('texto-enseñanza').innerHTML = datosEnseñanzas[numero].texto;

            // Actualizar el botón activo
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('activo'));
            boton.classList.add('activo');

            // Guardar el número de la enseñanza abierta
            enseñanzaActual = numero;
        }
    </script>
</body>
</html>
