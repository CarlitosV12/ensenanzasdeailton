<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enseñanzas y Moralejas</title>
    <!-- Importando fuentes elegantes de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* AQUÍ VA TU IMAGEN DE FONDO */
            background-image: url('Fondo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Contenedor principal oscuro y limpio para que resalte la letra */
        .contenedor {
            background: rgba(15, 15, 15, 0.85); /* Fondo oscuro semitransparente */
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            color: #ffffff;
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* Estilo de los botones */
        .botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        button:hover, button.activo {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
        }

        /* Área donde aparecerá la foto y el texto */
        #pantalla-enseñanza {
            display: none; /* Oculto hasta que se presione un botón */
            animation: fadeIn 0.8s ease;
        }

        #pantalla-enseñanza img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #texto-enseñanza {
            color: #e0e0e0;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Rincones de Sabiduría</h1>
        
        <div class="botones">
            <button onclick="mostrarEnseñanza(1)" id="btn-1">Enseñanza 1</button>
            <button onclick="mostrarEnseñanza(2)" id="btn-2">Enseñanza 2</button>
            <button onclick="mostrarEnseñanza(3)" id="btn-3">Enseñanza 3</button>
            <button onclick="mostrarEnseñanza(4)" id="btn-4">Enseñanza 4</button>
        </div>

        <div id="pantalla-enseñanza">
            <img id="imagen-enseñanza" src="" alt="Imagen de la enseñanza">
            <p id="texto-enseñanza"></p>
        </div>
    </div>

    <script>
        // Aquí guardaremos los textos y las rutas de tus fotos más adelante
        const datosEnseñanzas = {
            1: {
                imagen: "DEPICHONAREY.png",
                texto: "Todo gran vuelo comienza en el suelo. Hubo un tiempo en que fuiste aprendiz de la vida, frágil ante el viento, buscando tu lugar en el mundo. Pero la grandeza no es un salto repentino, sino una metamorfosis silenciosa. Convertirte en el rey de tu propia historia significa mirar al espejo y reconocer tu camino con gratitud: honrando al niño que soñaba, para abrazar con absoluta convicción al hombre que hoy forja su destino. El verdadero poder nace al descubrir que cada tropiezo pulió tu corona, y que la mejor versión de ti mismo es aquella que nunca deja de elevarse.<br><br>— Ailton"            },
            2: {
                imagen: "Ailtung.jpg",
                texto: "Así como Ailtungtung tiene la paciencia como virtud, es importante valorarla, pues en un mundo que exige inmediatez, saber esperar es un acto de fortaleza. La paciencia no es la simple inacción frente al paso del tiempo, sino la serenidad de mantener el propósito mientras las semillas que hemos plantado echan raíces en la oscuridad. Los grandes frutos de la vida, aquellos que verdaderamente trascienden, no maduran con la prisa. Aprender a aguardar el momento exacto nos enseña que cada pausa tiene un sentido, y que la recompensa más grande siempre llega a quienes saben ser guardianes serenos de su propio destino.<br><br>— Ailton"            },
            3: {
                imagen: "Ailtang.png",
                texto: "Ailtang sonríe a la vida, porque comprende que la alegría es la brújula que guía en los días nublados. No se trata de ignorar las tormentas, sino de enfrentarlas con un espíritu luminoso. Una simple sonrisa tiene el poder de transformar tu propio camino y aliviar la carga de quienes te rodean; es, al final, el acto de gratitud más hermoso frente a cada nuevo amanecer.<br><br>— Ailton"            },
            4: {
                imagen: "ELMERCENARIO.jpeg",
                texto: "Las batallas más duras de la vida no se pelean por el simple placer del combate, sino por la paz y la recompensa que aguardan al final del humo. Así como el mercenario tiene a sus dos palomas como símbolo de esperanza en medio del caos, tú debes aferrarte a aquello que da sentido a tu lucha. No temas a las trincheras del día a día; cada esfuerzo es un testimonio de tu valentía, y cada victoria, el dulce premio de no haberte rendido jamás.<br><br>— Ailton"            }
        };

        function mostrarEnseñanza(numero) {
            const pantalla = document.getElementById('pantalla-enseñanza');
            
            // 1. Reiniciar la animación
            pantalla.style.animation = 'none';
            pantalla.offsetHeight; /* Esto fuerza al navegador a recalcular y reiniciar el elemento */
            pantalla.style.animation = 'fadeIn 0.8s ease';

            // 2. Mostrar la sección (necesario para la primera vez que se hace clic)
            pantalla.style.display = 'block';

            // 3. Cambiar imagen y texto
            document.getElementById('imagen-enseñanza').src = datosEnseñanzas[numero].imagen;
            document.getElementById('texto-enseñanza').innerHTML = datosEnseñanzas[numero].texto;

            // 4. Actualizar el botón activo
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('activo'));
            document.getElementById(`btn-${numero}`).classList.add('activo');
        }
    </script>
</body>
</html>
